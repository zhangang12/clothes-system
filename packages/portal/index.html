<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
    <title>DATEX 供应商门户</title>
    <style>
      /* 加载骨架：与管理端同一套理由（见 packages/web/index.html 的说明）。
         门户跑在手机上、还常是移动网络，白屏时间只会更长。 */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column;
              align-items: center; justify-content: center; gap: 14px;
              background: #0F2E27; color: #E6F0EC; font-size: 14px;
              font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
      .boot-mark { width: 44px; height: 44px; border-radius: 12px;
                   border: 3px solid rgba(255,255,255,.22); border-top-color: #3FA88C;
                   animation: boot-spin .9s linear infinite; }
      .boot-name { font-size: 20px; font-weight: 700; letter-spacing: .18em; }
      .boot-tip { color: rgba(230,240,236,.65); font-size: 13px; }
      .boot-warn { color: #FF9A9C; }
      .boot-tip a { color: #6FD3B6; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
      <link rel="icon" type="image/png" href="/datex-mark.png" />
  </head>
  <body>
    <div id="app">
      <div class="boot">
        <div class="boot-mark"></div>
        <div class="boot-name">DATEX</div>
        <div class="boot-tip" id="boot-tip">正在加载…</div>
      </div>
    </div>
    <script>
      setTimeout(function () {
        var t = document.getElementById('boot-tip');
        if (!t) return;
        t.innerHTML = '加载超时，可能是版本刚更新。<a href="javascript:location.reload(true)">点此重新加载</a>';
        t.className = 'boot-tip boot-warn';
      }, 10000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
