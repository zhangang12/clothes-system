upstream api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP — 生产环境应启用下方 HTTPS server 块后将此块改为全部跳转
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # 配置好 SSL 证书后取消注释以下行并启用下方 HTTPS 块
    # return 301 https://$host$request_uri;

    # 略大于 multer 的 20MB 限制，为 multipart 开销留余量，避免 nginx 抢先返回 413
    client_max_body_size 25M;
    gzip on;
    # 【压缩级别必须显式写】nginx 的 gzip_comp_level **默认是 1**，压得很浅。
    # 2026-08-12 实测本站产物：elementPlus 那个包 level1=394KB、level6=338KB，
    # 主 CSS level1=69KB、level6=50KB——一句配置省掉 76KB 首屏流量。
    # 停在 6 不上 9：9 只再省 0.7KB，CPU 却明显更贵。静态产物又都是 immutable 长缓存，
    # 一个客户端只压这一次，这点 CPU 完全划算（机器常态 load 0.0x）。
    gzip_comp_level 6;
    gzip_min_length 1024;   # 小文件压了反而更大，还白费 CPU
    gzip_vary on;           # 告诉中间层「同一地址有压缩/未压缩两个版本」，否则可能发错给老客户端
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/font-woff2 font/woff2;

    # API 反向代理
    location /api/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # 文件访问（通过 X-Accel-Redirect 鉴权后才可访问）
    location /internal/files/ {
        internal;
        alias /data/uploads/;
        expires 1h;
        add_header Cache-Control "private";
    }

    # 供应商 H5 门户
    location /portal/ {
        root   /var/www;
        index  index.html;
        try_files $uri $uri/ /portal/index.html;
        add_header Cache-Control "no-cache";
    }

    # 管理后台 SPA
    location / {
        root   /var/www/web;
        index  index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";

        # 【immutable 只能给 /assets/】那里的文件名带内容哈希，内容一变文件名就变，
        # 所以可以放心说"永不改变"。而 /datex-mark.png、/favicon.ico 这些**名字是固定的**，
        # 给了 immutable 就等于：哪天换了 logo，老用户一年之内都看不到新的（浏览器根本不来问）。
        # 2026-08-12 实测线上确实是这个状态，本次一并纠正。
        location ^~ /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        # 根目录下的固定名静态文件：缓存一周，但允许过期后回来问一次
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
            add_header Cache-Control "public, max-age=604800";
        }
    }
}

